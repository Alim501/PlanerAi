# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
# disable data.sql seeding (uses PostgreSQL ON CONFLICT syntax not supported during H2 init)
spring.sql.init.mode=never

# JWT – secret must be ≥ 32 bytes for HMAC-SHA256
jwt.secret=testSecretKeyForTestingPurposesOnlyNotForProduction1234
jwt.access-token-expiration=PT2H
jwt.refresh-token-expiration=PT48H

# Frontend URL
front.url=http://localhost:4200

# AWS – dummy values; AwsConfig creates the client lazily, S3Client is @MockBean in tests
aws.access-key=AKIATESTKEY00000000
aws.secret-key=testSecretAccessKeyForLocalTestingOnly12345
aws.s3.bucket-name=test-bucket
aws.s3.region=us-east-1

# Kafka – lazy connection; no real broker needed for controller tests
spring.kafka.producer.bootstrap-servers=localhost:9092
spring.kafka.producer.properties.security.protocol=PLAINTEXT
spring.kafka.producer.properties.sasl.mechanism=PLAIN
spring.kafka.producer.properties.sasl.jaas.config=
spring.kafka.producer.properties.ssl.truststore.location=

# AI Service
ai.service.url=http://localhost:8000

# Suppress noise
logging.level.root=WARN
logging.level.projects.java.taskapi=INFO
