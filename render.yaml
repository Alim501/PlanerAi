services:
  - type: web
    name: plannerai-backend
    runtime: docker
    dockerfilePath: ./Back/Dockerfile
    dockerContext: ./Back
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ACCESS_TOKEN_EXP
        value: "3600000"
      - key: REFRESH_TOKEN_EXP
        value: "604800000"
      - key: FRONT_URL
        sync: false
      - key: AI_SERVICE_URL
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: "SASL_SSL"
      - key: KAFKA_SASL_MECHANISM
        value: "SCRAM-SHA-256"
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false
      - key: KAFKA_CA_CERT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: TASK_DEADLINE_CRON
        value: "0 0 9 * * *"
      - key: PLAN_END_DATE_CRON
        value: "0 0 9 * * *"

  - type: web
    name: plannerai-notification
    runtime: docker
    dockerfilePath: ./Notification-Service/Dockerfile
    dockerContext: ./Notification-Service
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: "SASL_SSL"
      - key: KAFKA_SASL_MECHANISM
        value: "SCRAM-SHA-256"
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false
      - key: KAFKA_CA_CERT
        sync: false
      - key: MAIL_HOST
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

  - type: web
    name: plannerai-ai-service
    runtime: docker
    dockerfilePath: ./AI-Service/Dockerfile
    dockerContext: ./AI-Service
    plan: free
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: BACKEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: plannerai-frontend
    runtime: docker
    dockerfilePath: ./Front/Dockerfile
    dockerContext: ./Front
    plan: free
    envVars:
      - key: API_URL
        sync: false
