<h2 mat-dialog-title>
  <mat-icon>{{ isEdit ? 'edit' : 'add' }}</mat-icon>
  {{ isEdit ? 'Редактировать предмет' : 'Создать предмет' }}
</h2>

<mat-dialog-content>
  <form [formGroup]="subjectForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Название предмета</mat-label>
      <input
        matInput
        formControlName="name"
        placeholder="Например: Математика, Физика"
        [disabled]="loading()"
      />
      <mat-icon matPrefix>school</mat-icon>
      @if (subjectForm.get('name')?.hasError('required')) {
      <mat-error>Название обязательно</mat-error>
      }
      @if (subjectForm.get('name')?.hasError('minlength')) {
      <mat-error>Минимум 2 символа</mat-error>
      }
    </mat-form-field>
  </form>

  @if (loading()) {
  <div class="loading-overlay">
    <mat-spinner diameter="40"></mat-spinner>
  </div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()" [disabled]="loading()">
    Отмена
  </button>
  <button
    mat-raised-button
    color="primary"
    (click)="save()"
    [disabled]="subjectForm.invalid || loading()"
  >
    <mat-icon>{{ isEdit ? 'save' : 'add' }}</mat-icon>
    {{ isEdit ? 'Сохранить' : 'Создать' }}
  </button>
</mat-dialog-actions>
